name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    # Fast job: style + unit tests that need no ML models.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -q tests/test_units.py tests/test_math.py

  end-to-end:
    # Full pipeline on the sample corpus + edge-case suite (downloads ~1.6 GB of models, cached).
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/whisper
          key: models-${{ hashFiles('config/default.yaml') }}
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Edge-case tests
        run: pytest -q tests/test_edge_cases.py
      - name: Run pipeline on sample submissions
        run: python run_integrity_check.py --input_dir ./sample_submissions --output_dir ./ci_reports
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: ci_reports/
